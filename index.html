<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function isInsideHeart(x, y, cx, cy, size) {
            const dx = (x - cx) / size;
            const dy = (y - cy) / size;
            return (dx * dx + dy * dy - 0.8) * (dx * dx + dy * dy - 0.8) * (dx * dx + dy * dy - 0.8) - dx * dx * dy * dy * dy <= 0;
        }

        function drawHeartText(cx, cy, size, text, fontSize) {
            const stepX = fontSize * 0.6;
            const stepY = fontSize * 1.2;
            
            const startX = cx - size;
            const startY = cy - size * 0.75;
            const endX = cx + size;
            const endY = cy + size * 0.75;
            
            let charIndex = 0;
            
            for (let y = startY; y <= endY; y += stepY) {
                for (let x = startX; x <= endX; x += stepX) {
                    if (isInsideHeart(x, y, cx, cy, size)) {
                        const char = text[charIndex % text.length];
                        ctx.fillText(char, x, y);
                        charIndex++;
                    }
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, width, height);
            
            const cx = width / 2;
            const cy = height / 2;
            const maxSize = Math.min(width, height) * 0.5;
            
            ctx.fillStyle = '#ff3366';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Рисуем сердца внутри сердца бесконечно
            let size = maxSize;
            let depth = 0;
            const depths = [
                { size: maxSize, fontSize: 14, opacity: 1 },
                { size: maxSize * 0.6, fontSize: 10, opacity: 0.8 },
                { size: maxSize * 0.35, fontSize: 7, opacity: 0.6 },
                { size: maxSize * 0.2, fontSize: 5, opacity: 0.4 },
                { size: maxSize * 0.12, fontSize: 3.5, opacity: 0.3 },
                { size: maxSize * 0.07, fontSize: 2.5, opacity: 0.2 },
            ];
            
            depths.forEach(({ size, fontSize, opacity }) => {
                ctx.globalAlpha = opacity;
                ctx.font = `${fontSize}px "Courier New", monospace`;
                drawHeartText(cx, cy, size, "love you ", fontSize);
            });
            
            ctx.globalAlpha = 1;
        }

        window.addEventListener('resize', () => {
            resize();
            draw();
        });

        resize();
        draw();
    </script>
</body>
</html>
