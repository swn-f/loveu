<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love U</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const text = "love u.";
        const particles = [];
        const heartPoints = [];
        const particleCount = 300;

        // Resize canvas
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateHeartPoints();
        }

        // Generate heart shape points
        function generateHeartPoints() {
            heartPoints.length = 0;
            const scale = Math.min(width, height) * 0.018;
            const centerX = width / 2;
            const centerY = height / 2 - scale * 0.5;

            for (let t = 0; t < Math.PI * 2; t += 0.01) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                heartPoints.push({
                    x: centerX + x * scale,
                    y: centerY + y * scale
                });
            }
        }

        // Particle class
        class Particle {
            constructor(targetX, targetY, index) {
                // Start from random positions
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.random() * 4 + 2;
                this.speed = Math.random() * 0.03 + 0.01;
                this.alpha = Math.random() * 0.5 + 0.5;
                this.color = this.getColor();
                this.letter = text[index % text.length];
                this.reached = false;
                this.delay = Math.random() * 100;
                this.progress = 0;
            }

            getColor() {
                const colors = [
                    '#ff6b8b', '#ff3366', '#ff1744', '#ff8a80', '#ff5252',
                    '#ff4081', '#f50057', '#ff5c8d', '#ffb3c6', '#ff99b4'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }

                if (!this.reached) {
                    this.progress += this.speed;
                    if (this.progress >= 1) {
                        this.progress = 1;
                        this.reached = true;
                    }

                    // Ease in-out animation
                    const t = this.progress;
                    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                    
                    this.x += (this.targetX - this.x) * ease * 0.1;
                    this.y += (this.targetY - this.y) * ease * 0.1;
                } else {
                    // Slight floating animation
                    this.y += Math.sin(Date.now() * 0.001 + this.x) * 0.2;
                    this.x += Math.cos(Date.now() * 0.001 + this.y) * 0.2;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.font = `${this.size * 4}px "Georgia", serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.letter, this.x, this.y);
                ctx.restore();
            }
        }

        // Initialize particles
        function initParticles() {
            particles.length = 0;
            const totalLetters = text.length;
            
            for (let i = 0; i < particleCount; i++) {
                const pointIndex = Math.floor((i / particleCount) * heartPoints.length);
                const point = heartPoints[pointIndex % heartPoints.length];
                
                // Add slight random offset
                const offsetX = (Math.random() - 0.5) * 10;
                const offsetY = (Math.random() - 0.5) * 10;
                
                particles.push(new Particle(
                    point.x + offsetX,
                    point.y + offsetY,
                    i % totalLetters
                ));
            }
        }

        // Draw background glow
        function drawGlow() {
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.min(width, height) * 0.5
            );
            gradient.addColorStop(0, 'rgba(255, 51, 102, 0.05)');
            gradient.addColorStop(0.5, 'rgba(255, 51, 102, 0.02)');
            gradient.addColorStop(1, 'rgba(13, 13, 13, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Dark background
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, width, height);
            
            drawGlow();
            
            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        // Click to regenerate
        canvas.addEventListener('click', () => {
            initParticles();
        });

        // Start
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
