<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function isInsideHeart(x, y, cx, cy, size) {
            const dx = (x - cx) / size;
            const dy = (y - cy) / size;
            
            // Перевёрнутое сердце: остриё вверх, дуги вниз
            const value = Math.pow(dx * dx + dy * dy - 1, 3) - dx * dx * (-dy) * (-dy) * (-dy);
            return value <= 0;
        }

        function draw() {
            time++;
            
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, width, height);
            
            const cx = width / 2;
            const cy = height / 2;
            const maxSize = Math.min(width, height) * 0.35;
            
            const fontSize = 14;
            const stepX = fontSize * 0.55;
            const stepY = fontSize * 1.1;
            
            ctx.fillStyle = '#ff3366';
            ctx.font = `bold ${fontSize}px "Courier New", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Заполняем весь экран текстом
            let charIndex = 0;
            const text = "love you ";
            
            for (let y = 0; y <= height; y += stepY) {
                for (let x = 0; x <= width; x += stepX) {
                    // Рисуем текст только если точка НЕ внутри сердца
                    if (!isInsideHeart(x, y, cx, cy, maxSize)) {
                        const char = text[charIndex % text.length];
                        ctx.fillText(char, x, y);
                    }
                    charIndex++;
                }
            }
            
            // Большая надпись в центре сердца
            const centerFontSize = Math.min(width, height) * 0.08;
            ctx.font = `bold ${centerFontSize}px "Georgia", serif`;
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Лёгкая пульсация
            const scale = 1 + Math.sin(time * 0.05) * 0.05;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.fillText('i love u.', 0, 0);
            ctx.restore();
        }

        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
        });

        resize();
        animate();
    </script>
</body>
</html>
